<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BugLens Editor</title>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top, #020617, #000);
color:#e2e8f0;
overflow:hidden;
}

/* 🌌 STARS */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.2;
}

/* ---------- TOP BAR ---------- */
.top{
padding:10px;
background:rgba(17,24,39,0.8);
backdrop-filter:blur(10px);
display:flex;
justify-content:space-between;
flex-wrap:wrap;
position:sticky;
top:0;
z-index:100;
}

/* BUTTONS */
button{
background:linear-gradient(135deg,#22c55e,#16a34a);
color:white;
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
margin:2px;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 12px #22c55e;
}

button.fix{
background:linear-gradient(135deg,#3b82f6,#2563eb);
}

/* INPUT */
input{
padding:8px;
border:none;
border-radius:6px;
background:#020617;
color:white;
}

/* ---------- LAYOUT ---------- */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* EDITOR */
.editor{
width:50%;
display:flex;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
}

/* LINE NUMBERS */
.lines{
width:50px;
background:#111827;
padding:10px;
text-align:right;
color:#22c55e;
font-size:12px;
}

/* TEXTAREA */
textarea{
width:100%;
background:#020617;
color:white;
border:none;
padding:10px;
font-family:monospace;
caret-color:#22c55e;
}

textarea:focus{
outline:none;
box-shadow:0 0 15px #22c55e;
}

/* PANEL */
.panel{
width:50%;
display:flex;
flex-direction:column;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
border-left:2px solid #22c55e;
box-shadow:-5px 0 15px rgba(34,197,94,0.3);
}

/* OUTPUT */
.outputBox{
flex:1;
padding:10px;
}

#out{
background:#020617;
padding:10px;
border-radius:8px;
font-family:monospace;
color:#22c55e;
overflow:auto;
}

/* SAVE */
.saveBox{
flex:1;
padding:10px;
overflow:auto;
}

.savedItem{
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,0.05);
padding:8px;
margin-top:5px;
border-radius:8px;
transition:0.3s;
}

.savedItem:hover{
background:rgba(34,197,94,0.1);
}

/* HEADINGS */
h3{
margin:0 0 5px 0;
color:#22c55e;
}

/* BOX */
.box{
background:#020617;
padding:10px;
border-radius:8px;
margin-top:10px;
border-left:4px solid #22c55e;
animation:fadeIn 0.3s;
}

.error{
background:#1e293b;
border-left:4px solid red;
padding:10px;
margin-top:10px;
}

/* STATUS */
.status{
position:fixed;
bottom:0;
width:100%;
background:#020617;
color:#22c55e;
padding:5px;
font-size:12px;
border-top:1px solid #22c55e;
}

/* ANIMATION */
@keyframes fadeIn{
from{opacity:0; transform:translateY(5px);}
to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="top">

<div>
<button onclick="undo()">↺</button>
<button onclick="redo()">↻</button>
<button onclick="checkCode()">Check</button>
<button onclick="runCode()">Run</button>
<button class="fix" onclick="showSuggestions()">Suggestions</button>
</div>

<div>
<button onclick="clearAll()">Clear</button>
<input id="projName" placeholder="Project name">
<button onclick="saveProject()">Save</button>
</div>

</div>

<div class="container">

<div class="editor">
<div class="lines" id="lines">1</div>
<textarea id="code" oninput="updateLines(); saveState()"></textarea>
</div>

<div class="panel">

<div class="outputBox">
<h3>Output</h3>
<div id="out">Write code and run</div>
</div>

<div class="saveBox">
<h3>Saved Projects</h3>
<div id="savedList"></div>
</div>

</div>

</div>

<div class="status" id="status">Ready</div>

<script>
let pyodide;

async function init(){
pyodide = await loadPyodide({
indexURL:"https://cdn.jsdelivr.net/pyodide/v0.25.1/full/"
});
}
init();

const code=document.getElementById('code');
const out=document.getElementById('out');
const savedList=document.getElementById('savedList');

function setStatus(msg){
status.innerText = msg;
}

function updateLines(){
let count=code.value.split('\n').length;
let html="";
for(let i=1;i<=count;i++) html+=i+"<br>";
lines.innerHTML=html;
}

/* UNDO REDO */
let history=[""];
let redoStack=[];

function saveState(){
history.push(code.value);
redoStack=[];
}

function undo(){
if(history.length>1){
redoStack.push(history.pop());
code.value=history[history.length-1];
updateLines();
}
}

function redo(){
if(redoStack.length){
let s=redoStack.pop();
history.push(s);
code.value=s;
updateLines();
}
}

/* RUN */
async function runCode(){
let c=code.value.trim();
if(!c){
out.innerHTML="Empty";
return;
}

out.innerHTML="<div class='box'>⏳ Running...</div>";
setStatus("Running...");

try{
pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
`);

await pyodide.runPythonAsync(c);

let result = pyodide.runPython("sys.stdout.getvalue()").trim();

out.innerHTML = result
? "<div class='box'>"+result+"</div>"
: "<div class='error'>No output</div>";

setStatus("Done");

}catch(e){
out.innerHTML="<div class='error'>⚠️ Error in code</div>";
setStatus("Error");
}
}

/* CHECK */
function checkCode(){
out.innerHTML="<div class='box'>Basic check done ✔</div>";
}

/* SUGGEST */
function showSuggestions(){
out.innerHTML="<div class='box'>Try using print() or loops 👍</div>";
}

/* SAVE */
function saveProject(){
let name=projName.value.trim();
if(!name){alert("Enter name");return;}

let store=JSON.parse(localStorage.getItem('buglens')||"{}");
store[name]={code:code.value};

localStorage.setItem('buglens',JSON.stringify(store));
loadSaved();
}

function loadSaved(){
let store=JSON.parse(localStorage.getItem('buglens')||"{}");
savedList.innerHTML="";

for(let k in store){
let d=document.createElement("div");
d.className="savedItem";
d.innerHTML="<span>"+k+"</span>";

let open=document.createElement("button");
open.innerText="Open";
open.onclick=()=>{code.value=store[k].code;updateLines();};

let del=document.createElement("button");
del.innerText="X";
del.onclick=()=>{delete store[k];localStorage.setItem('buglens',JSON.stringify(store));loadSaved();};

d.appendChild(open);
d.appendChild(del);
savedList.appendChild(d);
}
}

/* CLEAR */
function clearAll(){
code.value="";
out.innerHTML="Write code...";
updateLines();
setStatus("Cleared");
}

loadSaved();
updateLines();
</script>

</body>
</html>
