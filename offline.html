<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>You're Offline | BugLens</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0b1020;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .offline-card {
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      border: 1px solid #29344d;
      border-radius: 20px;
      background: #111a2e;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 20px;
      background: #1e2b45;
      font-size: 34px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #a8b3c7;
      font-size: 15px;
      line-height: 1.7;
    }

    button {
      margin-top: 26px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #7c6cff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #6a58f0;
    }

    .brand {
      margin-top: 28px;
      color: #7c6cff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You're offline</h1>
    <p>
      BugLens needs an internet connection to load this page.
      Check your connection and try again.
    </p>
    <button type="button" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="brand">BUGLENS</div>
  </main>
</body>
</html>
