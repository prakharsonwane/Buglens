<!DOCTYPE html>
<html>
<head>
<title>BugLens</title>

<style>
body{
margin:0;
height:100vh;
font-family:Arial;
display:flex;
justify-content:center;
align-items:flex-start;
background: radial-gradient(circle at bottom, #020617, #000);
overflow:hidden;
color:white;
}

/* ⭐ STARS */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.5;
animation:twinkle 4s infinite alternate;
}

@keyframes twinkle{
0%{opacity:0.3;}
100%{opacity:0.6;}
}

/* 🌠 SHOOTING STAR */
.shooting{
position:absolute;
width:2px;
height:80px;
background:linear-gradient(white, transparent);
animation:shoot 4s linear infinite;
opacity:0.7;
}

@keyframes shoot{
0%{
top:-10%;
left:80%;
transform:rotate(45deg);
opacity:1;
}
100%{
top:120%;
left:20%;
opacity:0;
}
}

/* 🪐 PLANETS */
.planet{
position:absolute;
border-radius:50%;
opacity:0.4;
animation:float 10s infinite alternate;
}

.p1{
width:80px;
height:80px;
background:#22c55e;
top:20%;
left:10%;
}

.p2{
width:60px;
height:60px;
background:#16a34a;
bottom:20%;
right:10%;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-30px);}
}

/* 🚀 ROCKETS */
.rockets span{
position:absolute;
font-size:20px;
animation:fly 10s linear infinite;
opacity:0.7;
}

.rockets span:nth-child(1){left:10%;}
.rockets span:nth-child(2){left:50%; animation-delay:3s;}
.rockets span:nth-child(3){left:80%; animation-delay:6s;}

@keyframes fly{
0%{bottom:-50px;}
100%{bottom:110%;}
}

/* TITLE */
#hero{
position:absolute;
top:40px;
width:100%;
text-align:center;
z-index:2;
}

#title{
font-size:52px;
color:#22c55e;
}

/* TAGLINE */
#tagline{
margin-top:100px;
text-align:center;
font-size:14px;
color:#94a3b8;
z-index:2;
position:absolute;
width:100%;
}

/* CARD */
.card{
margin-top:180px;
z-index:2;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.05);
padding:35px;
border-radius:24px;
width:320px;
text-align:center;
border:1px solid rgba(34,197,94,0.2);
box-shadow:0 0 40px rgba(34,197,94,0.2);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:rgba(255,255,255,0.05);
color:white;
}

/* PASSWORD */
.passBox{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#22c55e;
color:black;
font-weight:bold;
cursor:pointer;
}

/* LINKS */
.link{
font-size:13px;
margin-top:10px;
cursor:pointer;
color:#94a3b8;
}

/* MESSAGE */
#msg{
font-size:13px;
margin-top:10px;
min-height:18px;
}
</style>
</head>

<body>

<div class="shooting"></div>

<div class="planet p1"></div>
<div class="planet p2"></div>

<div class="rockets">
<span>🚀</span>
<span>🚀</span>
<span>🚀</span>
</div>

<div id="hero">
<h1 id="title">🐞 BugLens</h1>
</div>

<div id="tagline">
Build • Debug • Deploy Like a Pro 🚀
</div>

<div class="card">

<input id="user" placeholder="Username">

<div class="passBox">
<input id="pass" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<input id="color" placeholder="Favorite Color" style="display:none;">

<button id="actionBtn" onclick="login()">LOGIN</button>

<div id="msg"></div>

<div class="link" onclick="showSignup()">Create Account</div>
<div class="link" onclick="forgotPassword()">Forgot Password?</div>

</div>

<script>

window.onload=function(){
if(localStorage.getItem("username")){
showLogin();
}else{
showSignup();
}
}

function showMsg(t,c){
msg.innerText=t;
msg.style.color=c;
}

function signup(){
if(!user.value||!pass.value||!color.value){
showMsg("Fill all fields","#facc15");
return;
}
localStorage.setItem("username",user.value);
localStorage.setItem("password",pass.value);
localStorage.setItem("color",color.value);
showMsg("Account created","#22c55e");
showLogin();
}

function login(){
if(user.value===localStorage.getItem("username") &&
pass.value===localStorage.getItem("password")){
showMsg("Login success","#22c55e");
}else{
showMsg("Wrong credentials","#f87171");
}
}

function forgotPassword(){
let fav=prompt("Enter favorite color:");
if(fav===localStorage.getItem("color")){
let np=prompt("New password:");
localStorage.setItem("password",np);
showMsg("Password updated","#22c55e");
}else{
showMsg("Wrong answer","#f87171");
}
}

function showSignup(){
color.style.display="block";
actionBtn.innerText="SIGN UP";
actionBtn.onclick=signup;
showMsg("","");
}

function showLogin(){
color.style.display="none";
actionBtn.innerText="LOGIN";
actionBtn.onclick=login;
showMsg("","");
}

function togglePass(){
pass.type = pass.type==="password" ? "text" : "password";
}

</script>

</body>
</html>
