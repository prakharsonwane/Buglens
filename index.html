<!DOCTYPE html>
<html>
<head>
<title>BugLens</title>

<style>
body{
margin:0;
height:100vh;
font-family:Arial;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
background:#020617;
overflow:hidden;
color:white;
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
}

/* HERO */
#hero{
margin-top:70px;
text-align:center;
z-index:2;
display:flex;
flex-direction:column;
align-items:center;
}

#title{
font-size:64px;
font-weight:bold;
letter-spacing:3px;
color:#22c55e;
margin-bottom:10px;
text-shadow:0 0 20px #22c55e;
animation:glowPulse 3s infinite;
}

#tagline{
font-size:15px;
color:#94a3b8;
margin-bottom:40px;
}

@keyframes glowPulse{
0%{text-shadow:0 0 10px #22c55e;}
50%{text-shadow:0 0 30px #22c55e,0 0 60px #16a34a;}
100%{text-shadow:0 0 10px #22c55e;}
}

/* CARD */
.card{
z-index:2;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.06);
padding:35px;
border-radius:24px;
width:320px;
text-align:center;
border:1px solid #22c55e;
box-shadow:0 0 40px rgba(34,197,94,0.4);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:#020617;
color:white;
}

/* PASSWORD */
.passBox{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#22c55e;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px #22c55e;
}

/* LINKS */
.link{
font-size:13px;
margin-top:10px;
cursor:pointer;
color:#94a3b8;
}

.link:hover{
color:white;
}

/* MESSAGE */
#msg{
font-size:13px;
margin-top:10px;
min-height:18px;
}

/* PARTICLES BG */
.blob{
position:absolute;
width:200px;
height:200px;
background:#22c55e;
filter:blur(120px);
opacity:0.15;
border-radius:50%;
animation:moveBlob 10s infinite alternate;
}

.b1{top:10%;left:10%;}
.b2{bottom:10%;right:10%;background:#16a34a;}

@keyframes moveBlob{
0%{transform:translate(0,0);}
100%{transform:translate(40px,-40px);}
}

/* FLOAT ICONS */
.stickers span{
position:absolute;
font-size:22px;
opacity:0.6;
animation:float 6s infinite ease-in-out;
}

.stickers span:nth-child(1){top:20%;left:10%;}
.stickers span:nth-child(2){top:30%;right:15%;animation-delay:1s;}
.stickers span:nth-child(3){bottom:25%;left:20%;animation-delay:2s;}
.stickers span:nth-child(4){bottom:15%;right:25%;animation-delay:3s;}
.stickers span:nth-child(5){top:50%;left:50%;animation-delay:4s;}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="stickers">
<span>🚀</span>
<span>⚡</span>
<span>💻</span>
<span>🧠</span>
<span>🔥</span>
</div>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div id="hero">
<h1 id="title">🐞 BugLens</h1>
<div id="tagline">Build • Debug • Deploy Like a Pro 🚀</div>
</div>

<div class="card">

<input id="user" placeholder="Username">

<div class="passBox">
<input id="pass" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<input id="color" placeholder="Favorite Color" style="display:none;">

<button id="actionBtn" onclick="login()">LOGIN</button>

<div id="msg"></div>

<div class="link" onclick="showSignup()">Create Account</div>
<div class="link" onclick="forgotPassword()">Forgot Password?</div>

</div>

<script>

/* PARTICLES */
let canvas=document.getElementById("bg");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(34,197,94,0.8)";
ctx.fill();
p.x+=p.dx;
p.y+=p.dy;
if(p.x<0||p.x>canvas.width) p.dx*=-1;
if(p.y<0||p.y>canvas.height) p.dy*=-1;
});
requestAnimationFrame(draw);
}
draw();

/* LOGIN SYSTEM */
window.onload=function(){
if(localStorage.getItem("username")){
showLogin();
}else{
showSignup();
}
}

function showMsg(t,c){
msg.innerText=t;
msg.style.color=c;
}

function signup(){
if(!user.value||!pass.value||!color.value){
showMsg("Fill all fields","#facc15");
return;
}
localStorage.setItem("username",user.value);
localStorage.setItem("password",pass.value);
localStorage.setItem("color",color.value);
showMsg("Account created","#22c55e");
showLogin();
}

function login(){
if(user.value===localStorage.getItem("username") &&
pass.value===localStorage.getItem("password")){
showMsg("Login success","#22c55e");
setTimeout(()=>{
window.location.href="editor.html";
},800);
}else{
showMsg("Wrong credentials","#f87171");
}
}

function forgotPassword(){
let fav=prompt("Enter favorite color:");
if(fav===localStorage.getItem("color")){
let np=prompt("New password:");
localStorage.setItem("password",np);
showMsg("Password updated","#22c55e");
}else{
showMsg("Wrong answer","#f87171");
}
}

function showSignup(){
color.style.display="block";
actionBtn.innerText="SIGN UP";
actionBtn.onclick=signup;
showMsg("","");
}

function showLogin(){
color.style.display="none";
actionBtn.innerText="LOGIN";
actionBtn.onclick=login;
showMsg("","");
}

function togglePass(){
pass.type = pass.type==="password" ? "text" : "password";
}

</script>

</body>
</html>
