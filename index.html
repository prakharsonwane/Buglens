<!DOCTYPE html>
<html>
<head>
<title>BugLens</title>

<style>
body{
margin:0;
height:100vh;
font-family:Arial;
display:flex;
justify-content:center;
align-items:flex-start;
background: radial-gradient(circle at bottom, #020617, #000);
overflow:hidden;
color:white;
}

/* STARS BACKGROUND */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.4;
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
}

/* HERO */
#hero{
position:absolute;
top:40px;
text-align:center;
width:100%;
z-index:2;
}

#title{
font-size:52px;
font-weight:bold;
letter-spacing:2px;
color:#22c55e;
}

/* CARD */
.card{
margin-top:160px;
z-index:2;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.05);
padding:35px;
border-radius:24px;
width:320px;
text-align:center;
border:1px solid rgba(34,197,94,0.2);
box-shadow:0 0 40px rgba(34,197,94,0.2);
transition:0.3s;
}

.card:hover{
transform:scale(1.02);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:rgba(255,255,255,0.05);
color:white;
outline:none;
}

input:focus{
box-shadow:0 0 10px #22c55e;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#22c55e;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 15px #22c55e;
}

/* LINKS */
.link{
font-size:13px;
margin-top:10px;
cursor:pointer;
color:#94a3b8;
}

.link:hover{
color:white;
}

/* MESSAGE */
#msg{
font-size:13px;
margin-top:10px;
min-height:18px;
}

/* ROCKETS */
.rockets span{
position:absolute;
font-size:22px;
animation:fly 10s linear infinite;
opacity:0.7;
}

.rockets span:nth-child(1){
left:10%;
animation-delay:0s;
}
.rockets span:nth-child(2){
left:50%;
animation-delay:3s;
}
.rockets span:nth-child(3){
left:80%;
animation-delay:6s;
}

@keyframes fly{
0%{
bottom:-50px;
transform:translateX(0) rotate(0deg);
}
100%{
bottom:110%;
transform:translateX(60px) rotate(360deg);
}
}
</style>
</head>

<body>

<!-- ROCKETS -->
<div class="rockets">
<span>🚀</span>
<span>🚀</span>
<span>🚀</span>
</div>

<!-- HERO -->
<div id="hero">
<h1 id="title">🐞 BugLens</h1>
</div>

<!-- LOGIN CARD -->
<div class="card">

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<input id="color" placeholder="Favorite Color" style="display:none;">

<button id="actionBtn" onclick="login()">LOGIN</button>

<div id="msg"></div>

<div class="link" onclick="showSignup()">Create Account</div>
<div class="link" onclick="forgotPassword()">Forgot Password?</div>

</div>

<script>

/* INIT */
window.onload=function(){
if(localStorage.getItem("username")){
showLogin();
}else{
showSignup();
}
}

/* MESSAGE */
function showMsg(text,color){
let m=document.getElementById("msg");
m.innerText=text;
m.style.color=color;
}

/* SIGNUP */
function signup(){
let u=user.value;
let p=pass.value;
let c=color.value;

if(!u||!p||!c){
showMsg("⚠ Fill all fields","#facc15");
return;
}

localStorage.setItem("username",u);
localStorage.setItem("password",p);
localStorage.setItem("color",c);

showMsg("✅ Account created","#22c55e");
showLogin();
}

/* LOGIN */
function login(){
let u=user.value;
let p=pass.value;

let su=localStorage.getItem("username");
let sp=localStorage.getItem("password");

if(u===su && p===sp){
showMsg("✅ Login success","#22c55e");
}else{
showMsg("❌ Wrong credentials","#f87171");
}
}

/* FORGOT */
function forgotPassword(){
let fav=prompt("Enter your favorite color:");
let sc=localStorage.getItem("color");

if(fav===sc){
let newPass=prompt("Enter new password:");
localStorage.setItem("password",newPass);
showMsg("✅ Password updated","#22c55e");
}else{
showMsg("❌ Wrong answer","#f87171");
}
}

/* MODES */
function showSignup(){
document.getElementById("color").style.display="block";
document.getElementById("actionBtn").innerText="SIGN UP";
document.getElementById("actionBtn").onclick=signup;
showMsg("", "");
}

function showLogin(){
document.getElementById("color").style.display="none";
document.getElementById("actionBtn").innerText="LOGIN";
document.getElementById("actionBtn").onclick=login;
showMsg("", "");
}

</script>

</body>
</html>
