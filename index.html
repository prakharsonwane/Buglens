<!DOCTYPE html>
<html>
<head>
<title>BugLens</title>

<style>
body{
margin:0;
height:100vh;
font-family:Arial;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
background: radial-gradient(circle at bottom, #020617, #000);
overflow:hidden;
color:white;
}

/* STARS */
body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:url('https://www.transparenttextures.com/patterns/stardust.png');
opacity:0.4;
}

/* HERO */
#hero{
margin-top:60px;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
z-index:2;
}

#title{
font-size:52px;
color:#22c55e;
margin-bottom:10px;
}

#tagline{
font-size:14px;
color:#94a3b8;
margin-bottom:40px;
}

/* CARD */
.card{
z-index:2;
backdrop-filter:blur(25px);
background:rgba(255,255,255,0.05);
padding:35px;
border-radius:24px;
width:320px;
text-align:center;

/* NEON */
border:1px solid #22c55e;
box-shadow:0 0 20px #22c55e, 0 0 40px rgba(34,197,94,0.5);
}

/* INPUT */
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
background:rgba(255,255,255,0.05);
color:white;
}

/* PASSWORD */
.passBox{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#22c55e;
color:black;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px #22c55e;
}

/* LINKS */
.link{
font-size:13px;
margin-top:10px;
cursor:pointer;
color:#94a3b8;
}

.link:hover{
color:white;
}

/* MESSAGE */
#msg{
font-size:13px;
margin-top:10px;
min-height:18px;
}
</style>
</head>

<body>

<div id="hero">
<h1 id="title">🐞 BugLens</h1>
<div id="tagline">Build • Debug • Deploy Like a Pro 🚀</div>
</div>

<div class="card">

<input id="user" placeholder="Username">

<div class="passBox">
<input id="pass" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<input id="color" placeholder="Favorite Color" style="display:none;">

<button id="actionBtn" onclick="login()">LOGIN</button>

<div id="msg"></div>

<div class="link" onclick="showSignup()">Create Account</div>
<div class="link" onclick="forgotPassword()">Forgot Password?</div>

</div>

<script>

window.onload=function(){
if(localStorage.getItem("username")){
showLogin();
}else{
showSignup();
}
}

function showMsg(t,c){
msg.innerText=t;
msg.style.color=c;
}

function signup(){
if(!user.value||!pass.value||!color.value){
showMsg("Fill all fields","#facc15");
return;
}
localStorage.setItem("username",user.value);
localStorage.setItem("password",pass.value);
localStorage.setItem("color",color.value);
showMsg("Account created","#22c55e");
showLogin();
}

function login(){
if(user.value===localStorage.getItem("username") &&
pass.value===localStorage.getItem("password")){

showMsg("Login success","#22c55e");

/* REDIRECT */
setTimeout(()=>{
window.location.href="editor.html";
},800);

}else{
showMsg("Wrong credentials","#f87171");
}
}

function forgotPassword(){
let fav=prompt("Enter favorite color:");
if(fav===localStorage.getItem("color")){
let np=prompt("New password:");
localStorage.setItem("password",np);
showMsg("Password updated","#22c55e");
}else{
showMsg("Wrong answer","#f87171");
}
}

function showSignup(){
color.style.display="block";
actionBtn.innerText="SIGN UP";
actionBtn.onclick=signup;
showMsg("","");
}

function showLogin(){
color.style.display="none";
actionBtn.innerText="LOGIN";
actionBtn.onclick=login;
showMsg("","");
}

function togglePass(){
pass.type = pass.type==="password" ? "text" : "password";
}

</script>

</body>
</html>
