<!DOCTYPE html>
<html>
<head>
<title>BugLens</title>

<style>
body{
margin:0;
height:100vh;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle at top,#020617,#000);
overflow:hidden;
color:white;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

canvas{
position:absolute;
top:0;
left:0;
}

/* HERO */
#hero{
position:absolute;
top:60px;
text-align:center;
z-index:2;
}

#title{
font-size:56px;
font-weight:bold;
letter-spacing:2px;

color:#22c55e; /* fallback */

background: linear-gradient(90deg,#22c55e,#4ade80,#16a34a);

background-clip:text;
-webkit-background-clip: text;
color:transparent;
}

/* FIX: removed problematic text-shadow */

#subtitle{
margin-top:10px;
font-size:15px;
color:#94a3b8;
}

/* CARD */
.card{
z-index:2;
backdrop-filter:blur(30px);
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:28px;
width:340px;
text-align:center;
border:1px solid rgba(34,197,94,0.25);
box-shadow:0 10px 60px rgba(34,197,94,0.2);
transition:0.4s ease;
}

.card:hover{
transform:scale(1.02);
}

/* INPUT */
input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:rgba(255,255,255,0.05);
color:white;
outline:none;
transition:0.3s;
}

input:focus{
box-shadow:0 0 15px #22c55e;
background:rgba(255,255,255,0.08);
transform:scale(1.03);
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#22c55e,#16a34a);
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
box-shadow:0 0 25px #22c55e;
transform:scale(1.05);
}

/* LINKS */
.link{
font-size:13px;
margin-top:10px;
cursor:pointer;
color:#94a3b8;
}

.link:hover{
color:white;
}

/* MESSAGE */
#msg{
font-size:13px;
margin-top:10px;
min-height:18px;
}

/* PASSWORD BOX */
.passBox{
position:relative;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* PARTICLES */
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="hero">
  <h1 id="title">🐞 BugLens</h1>
  <p id="subtitle">Build. Debug. Deploy. Like a Pro 🚀</p>
</div>

<div class="card">

<input id="user" placeholder="Username">

<div class="passBox">
<input id="pass" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<input id="color" placeholder="Favorite Color" style="display:none;">

<button id="actionBtn" onclick="login()">LOGIN</button>

<div id="msg"></div>

<div class="link" onclick="showSignup()">Create Account</div>
<div class="link" onclick="forgotPassword()">Forgot Password?</div>

</div>

<script>

/* PARTICLES */
let canvas=document.getElementById("bg");
let ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
dx:(Math.random()-0.5),
dy:(Math.random()-0.5)
});
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(34,197,94,0.8)";
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width) p.dx*=-1;
if(p.y<0||p.y>canvas.height) p.dy*=-1;
});

requestAnimationFrame(draw);
}
draw();

/* LOGIC */

window.onload=function(){
if(localStorage.getItem("username")){
showLogin();
}else{
showSignup();
}
}

function showMsg(text,color){
let m=document.getElementById("msg");
m.innerText=text;
m.style.color=color;
}

function signup(){
let u=user.value;
let p=pass.value;
let c=color.value;

if(!u||!p||!c){
showMsg("⚠ Fill all fields","#facc15");
return;
}

localStorage.setItem("username",u);
localStorage.setItem("password",p);
localStorage.setItem("color",c);

showMsg("✅ Account created","#22c55e");
showLogin();
}

function login(){
let u=user.value;
let p=pass.value;

let su=localStorage.getItem("username");
let sp=localStorage.getItem("password");

if(u===su && p===sp){
showMsg("✅ Login success","#22c55e");
setTimeout(()=>{
window.location.href="editor.html";
},800);
}else{
showMsg("❌ Wrong credentials","#f87171");
}
}

function forgotPassword(){
let fav=prompt("Enter your favorite color:");
let sc=localStorage.getItem("color");

if(fav===sc){
let newPass=prompt("Enter new password:");
localStorage.setItem("password",newPass);
showMsg("✅ Password updated","#22c55e");
}else{
showMsg("❌ Wrong answer","#f87171");
}
}

function showSignup(){
document.getElementById("color").style.display="block";
document.getElementById("actionBtn").innerText="SIGN UP";
document.getElementById("actionBtn").onclick=signup;
showMsg("Create new account","#94a3b8");
}

function showLogin(){
document.getElementById("color").style.display="none";
document.getElementById("actionBtn").innerText="LOGIN";
document.getElementById("actionBtn").onclick=login;
showMsg("Welcome back","#94a3b8");
}

function togglePass(){
let p=document.getElementById("pass");
p.type = p.type==="password" ? "text" : "password";
}

</script>

</body>
</html>
